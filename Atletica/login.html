<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Área da Gestão — AAAUPA." />
  <meta name="robots" content="noindex, nofollow" />
  <title>Acesso — AAAUPA Gestão</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">🦜</div>
      <h2>AAAUPA</h2>
      <p id="login-subtitulo">Área da Gestão</p>
    </div>

    <form id="form-login" novalidate aria-label="Formulário de acesso">
      <div class="form-group">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" name="email" placeholder="seu-email@unifei.edu.br" required autocomplete="email" />
      </div>
      
      <div class="form-group">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" name="senha" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <div class="form-group" id="group-confirmar-senha" style="display: none;">
        <label for="login-confirmar-senha">Confirmar Senha</label>
        <input type="password" id="login-confirmar-senha" name="confirmar-senha" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-full" style="margin-top:0.5rem;">
        Entrar na Gestão
      </button>
      
      <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #475569;">
        <span id="texto-alternar">Não tem uma conta?</span> 
        <a href="#" id="link-alternar" style="color: #005088; font-weight: bold; text-decoration: none;">Cadastre-se</a>
      </p>

      <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 1rem 0 0.5rem 0;" />
      
      <p style="text-align: center; margin: 0; font-size: 0.9rem;">
        <a href="index.html" style="color: #64748b; text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 0.25rem;">
          ← Voltar ao site
        </a>
      </p>
    </form>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>

</body>
</html>
